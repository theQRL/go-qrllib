name: Test

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.25.x', '1.26.x']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Display Go version
        run: go version

      - name: Verify dependencies
        run: go mod verify

      - name: Install dependencies
        run: go get -v ./...

      - name: Build
        run: go build -v ./...

      - name: Vet build-tagged tests
        # The ACVP, Wycheproof and metamorphic tests sit behind build tags, so
        # the plain build, test and lint runs never compile them. Vet them
        # with their tags here so that an API change cannot break those
        # workflows unnoticed.
        run: |
          go vet -tags acvp ./crypto/ml_dsa_87/
          go vet -tags wycheproof ./crypto/ml_dsa_87/ ./crypto/internal/mlkem1024/
          go vet -tags metamorphic ./crypto/ml_dsa_87/ ./crypto/internal/mlkem1024/

      - name: Test
        # Note: SPHINCS+ wallet tests are slow and can take several minutes.
        # No pipes here: they would mask go test's exit status (default shell has no pipefail).
        run: go clean -testcache && go test -v ./... -coverprofile=coverage.out -covermode=atomic

      - name: Test Falcon-1024 with fused multiply-add instructions
        # The Falcon-1024 floating-point code must round every operation
        # individually to reproduce the reference implementation bit for bit.
        # The default amd64 build (GOAMD64=v1) never fuses multiply-adds, so
        # the explicit-rounding guards are only exercised on targets that do:
        # arm64, ppc64, s390x, riscv64 and amd64 with GOAMD64=v3. Without
        # those guards the round-3 KAT suite fails here (seed 65 generates a
        # different key) while passing in the default build above.
        env:
          GOAMD64: v3
        run: go test -count=1 ./crypto/internal/falcon1024/... ./crypto/falcon1024/...

      - name: Process coverage exclusions
        run: |
          # Pinned; quantumcycle/go-ignore-cov is the maintained home of the
          # former hexira/go-ignore-cov. Keep in sync with the Makefile.
          go install github.com/quantumcycle/go-ignore-cov@v0.7.1
          go-ignore-cov --file coverage.out --ignore-empty

      - name: Test with race detector
        timeout-minutes: 60
        # Use -short to skip slow SPHINCS+ tests that don't provide additional race coverage
        run: go test -race -short -v ./...

      - name: Run fuzz tests
        # shell: bash for pipefail — fuzz failures and empty target lists must fail the job.
        shell: bash
        run: |
          set -euo pipefail
          # Use a fixed iteration budget so CI does not cancel a slow crypto
          # operation mid-call and report a fuzz-worker context deadline.
          for pkg in ./crypto/xmss ./crypto/sphincsplus_256s ./crypto/ml_dsa_87 ./crypto/internal/mlkem1024 ./crypto/falcon1024 ./wallet/misc; do
            echo "Fuzzing $pkg..."
            targets=$(go test "$pkg" -list 'Fuzz.*' | grep '^Fuzz' || true)
            if [ -z "$targets" ]; then
              echo "ERROR: no fuzz targets found in $pkg (listing failed or targets were removed)"
              exit 1
            fi
            while IFS= read -r fuzz; do
              echo "  Running $fuzz..."
              # Unit tests already ran above; skip rerunning them per target. A
              # fixed input count is deterministic across runner speeds, and the
              # counts are sized per package from measured throughput to ~2-3 s
              # each. SPHINCS+ operations are slow (~70 execs/s), which is the
              # original reason for counts over wall-clock; it stays small.
              case "$pkg" in
                ./crypto/sphincsplus_256s) budget=200x ;;
                ./crypto/xmss)             budget=200000x ;;
                ./wallet/misc)             budget=500000x ;;
                *)                         budget=20000x ;;
              esac
              go test "$pkg" -run='^$' -parallel=1 -fuzz="^${fuzz}\$" -fuzztime="$budget"
            done <<< "$targets"
          done

      - name: Run metamorphic invariant sweep
        # Build-tagged exhaustive bit-by-bit metamorphic tests
        # contributed by Trail of Bits during the audit engagement.
        # Runs in ~30s; guarded behind `-tags metamorphic` so it doesn't
        # slow down day-to-day `go test ./...`.
        timeout-minutes: 5
        run: go test -tags metamorphic -count=1 -run "TestMetamorphic" -timeout 5m ./crypto/ml_dsa_87/ ./crypto/internal/mlkem1024/

      - name: Upload coverage to Codecov
        # One upload per run: the matrix entries produce identical coverage.
        if: github.repository == 'theQRL/go-qrllib' && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.go-version == '1.25.x'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: go-qrllib
          fail_ci_if_error: true
